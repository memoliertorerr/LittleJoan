<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Little Joan Settings</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./settings.ts"></script>
  </head>
  <body>
    <main class="settings">
      <h1>Settings</h1>
      <div class="row">
        <span class="label" id="shortcut-label">Shortcut</span>
        <button id="shortcut" class="recorder" type="button" aria-labelledby="shortcut-label">…</button>
      </div>
      <p class="note" id="shortcut-note">Click, then press the keys you want to use.</p>
      <label class="row" for="engine">
        <span class="label">Search with</span>
        <select id="engine"></select>
      </label>
      <label class="row" for="language">
        <span class="label">Translate pages to</span>
        <select id="language"></select>
      </label>
      <p id="error" class="error" role="alert" hidden></p>
      <div class="actions">
        <button id="cancel" type="button">Cancel</button>
        <button id="save" class="primary" type="button">Save</button>
      </div>
    </main>
  </body>
</html>
