[package]
name = "little-joan"
version = "0.2.0"
description = "A tiny pop-up browser that hibernates until a global shortcut calls it."
authors = ["Mehmet Ali Ertorer"]
license = "MIT"
repository = "https://github.com/memoliertorerr/LittleJoan"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "little_joan_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# `unstable`: the URL bar is a second webview in the page window, and Tauri 2.12 keeps its
# multi-webview API (window::WindowBuilder, Window::add_child, Manager::get_webview) behind it.
tauri = { version = "2.12", features = ["tray-icon", "image-png", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-opener = "2.7"
# Start at login (LaunchAgent / registry Run key / XDG autostart), used from Rust only.
tauri-plugin-autostart = "2.5"

# Same versions as wry uses, so the WebView2 types unify (see Cargo.lock).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
# Win32 clipboard (System_DataExchange, System_Memory) for extensions' clipboard.writeText;
# BCryptGenRandom (Security_Cryptography) for the extension runtime's nonces and tokens.
windows = { version = "0.62", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Security_Cryptography",
] }
# Start at login creates the per-user Run key when a profile lacks it (autostart.rs); the same
# version tauri-plugin-autostart's auto-launch already uses, so nothing new to fetch.
winreg = "0.10"

# Phone mode sets WKWebView's customUserAgent (same versions as wry uses; nothing new to fetch).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# Phone mode sets WebKitSettings' user agent (same version as wry uses; nothing new to fetch).
webkit2gtk = "2.0"
# The Wayland-native global shortcut (LJ17): the XDG GlobalShortcuts portal. Default features
# off; tokio, the runtime of tauri::async_runtime. It shares the zbus 5 the single-instance and
# opener plugins already use — zbus then runs on tokio too, its blocking API on a runtime of its
# own (see the plan's Landmines).
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }

[profile.dev]
# No debug info: it would multiply the size of target/ on a tight local disk.
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Not "abort": on macOS, Tauri answers the app's own tauri:// requests from a tokio thread, and
# wry catches the Objective-C exception WebKit raises when such a request's navigation was
# cancelled meanwhile ("task already stopped") with objc2::exception::catch, which cannot work
# under panic = "abort" (objc2's docs): the exception then aborted the app ("panic in a function
# that cannot unwind", CI run 39066776951). See the plan's Landmines.
panic = "unwind"
strip = true
