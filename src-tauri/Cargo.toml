[package]
name = "little-joan"
version = "0.1.0"
description = "A tiny pop-up browser that hibernates until a global shortcut calls it."
authors = ["Mehmet Ali Ertorer"]
license = "MIT"
repository = "https://github.com/memoliertorerr/LittleJoan"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "little_joan_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-opener = "2.7"

# Same versions as wry uses, so the WebView2 types unify (see Cargo.lock).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.dev]
# No debug info: it would multiply the size of target/ on a tight local disk.
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
