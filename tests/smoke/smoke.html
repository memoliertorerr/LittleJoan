<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LJ-SMOKE loading</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
        background: #1f2a44;
        color: #ffffff;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #1f2a44;
      }
      #stage:fullscreen,
      #stage:-webkit-full-screen {
        background: #2e7d32;
      }
      #go {
        width: 86vw;
        height: 70vh;
        font-size: 28px;
        font-weight: 600;
        border: 0;
        border-radius: 16px;
        background: #f7c948;
        color: #1f2a44;
        cursor: pointer;
      }
      #status {
        font-size: 15px;
        text-align: center;
        padding: 0 12px;
      }
      video {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <button id="go" type="button">Go fullscreen</button>
      <p id="status">loading…</p>
      <video id="video" muted playsinline></video>
    </div>
    <script type="module">
      import {
        codecSupport,
        fullscreenTitle,
        isFullscreen,
        persistRequest,
        persistSet,
        persistTitle,
        PERSIST_STORAGE_KEY,
        readyTitle,
        requestFullscreen,
        viewportTitle,
      } from "./smoke-logic.mjs";
      import { probeApi, probeFile, probeRequest, probeTitle, raceRequest, RACE } from "./ext-probe.mjs";

      const stage = document.getElementById("stage");
      const status = document.getElementById("status");
      const show = (title) => {
        document.title = title;
        status.textContent = title;
      };
      const stored = () => {
        try {
          return localStorage.getItem(PERSIST_STORAGE_KEY);
        } catch {
          return null;
        }
      };

      // ?persist=set|check&t=<token>: the login-persistence check (cookies + localStorage). It
      // reports only that, so the title stays put for the smoke test to read.
      const persist = persistRequest(location.search);
      // ?ext=probe&base=<an extension's origin>: what a web page can't do to an extension.
      const probe = probeRequest(location.search);
      // ?ext=race&base=<origin>: iframes and window.open at the panel while the app opens it.
      const race = raceRequest(location.search);
      if (probe) {
        void runProbe(probe.base);
      } else if (race) {
        runRace(race.base);
      } else if (persist) {
        show(
          persist.mode === "set"
            ? persistSet(document, localStorage, persist.token)
            : persistTitle(document.cookie, stored(), persist.token),
        );
      } else {
        startCodecAndViewportReports();
      }

      function runRace(base) {
        show("LJ-EXTRACE running");
        const target = `${base}/index.html`;
        const started = Date.now();
        let frame = null;
        let opened = 0;
        const timer = setInterval(() => {
          if (Date.now() - started > RACE.durationMs) {
            clearInterval(timer);
            show(`LJ-EXTRACE done opened=${opened}`);
            return;
          }
          frame?.remove();
          frame = document.createElement("iframe");
          frame.src = target;
          document.body.append(frame);
          if (Math.random() < 0.1) {
            opened += window.open(target) ? 1 : 0;
          }
        }, RACE.everyMs);
      }

      async function runProbe(base) {
        show("LJ-EXTPROBE running");
        const loadImage = (src) =>
          new Promise((done) => {
            const img = new Image();
            const timer = setTimeout(() => done(false), 3000);
            img.onload = () => {
              clearTimeout(timer);
              done(true);
            };
            img.onerror = () => {
              clearTimeout(timer);
              done(false);
            };
            img.src = src;
          });
        // A request that never settles didn't succeed either.
        const fetchWithin = (url, init) =>
          Promise.race([
            fetch(url, init),
            new Promise((_, fail) => setTimeout(() => fail(new Error("no answer")), 5000)),
          ]);
        const api = await probeApi(fetchWithin, base);
        const file = await probeFile(loadImage, base);
        // Last, try to take the page webview to the extension's panel: the app must refuse it
        // (the page stays, and reports). If it went through, the panel's own title shows instead.
        location.href = `${base}/index.html`;
        await new Promise((done) => setTimeout(done, 2500));
        show(probeTitle({ api, file, nav: "refused" }));
      }

      function startCodecAndViewportReports() {
        show(readyTitle(codecSupport(document.getElementById("video"), globalThis.MediaSource)));

        // What the page sees (CSS viewport, user agent), reported shortly after load and after
        // every resize has settled.
        let resizeTimer = 0;
        const reportViewport = () =>
          show(viewportTitle(window.innerWidth, window.innerHeight, navigator.userAgent, window.devicePixelRatio));
        setTimeout(reportViewport, 300);
        window.addEventListener("resize", () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(reportViewport, 300);
        });
        document.getElementById("go").addEventListener("click", () => requestFullscreen(stage));
        for (const name of ["fullscreenchange", "webkitfullscreenchange"]) {
          document.addEventListener(name, () => show(fullscreenTitle(isFullscreen(document))));
        }
      }
    </script>
  </body>
</html>
