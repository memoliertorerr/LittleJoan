name: Bug report
description: Something in Little Joan doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please check the
        [open issues](https://github.com/memoliertorerr/LittleJoan/issues) and the known issues in the
        [changelog](https://github.com/memoliertorerr/LittleJoan/blob/main/CHANGELOG.md) first.

        **Security problems don't belong here.** Please report them privately, as described in
        [SECURITY.md](https://github.com/memoliertorerr/LittleJoan/blob/main/SECURITY.md)
        (Security tab → **Report a vulnerability**).
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple silicon)
        - macOS (Intel)
        - Linux (x86_64)
        - Linux (ARM64)
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      description: On Linux, also the desktop and whether it's a Wayland or X11 session.
      placeholder: "e.g. Windows 11 24H2, macOS 15.1, Ubuntu 24.04 with GNOME on Wayland"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Little Joan version
      description: Settings → About shows it.
      placeholder: "e.g. 0.2.1"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - Windows installer (.exe)
        - macOS disk image (.dmg)
        - Linux .deb
        - Linux AppImage
        - A CI build artifact
        - Built from source
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, one step at a time, starting from Little Joan hibernating in the tray / menu bar.
      placeholder: |
        1. Press the shortcut (Ctrl/Cmd+Shift+Space)
        2. Type example.com and press Enter
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Error messages, a crash, the window in the wrong place… as exactly as you can.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or a screen recording
      description: Drag files in here if they help. Please leave out anything personal — signed-in pages, addresses, history.
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Whether it happens every time, other apps that might be involved (another app using the same shortcut, say), terminal output if you started Little Joan from one.
