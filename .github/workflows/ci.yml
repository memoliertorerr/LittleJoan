name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      installers_from_run:
        description: "Smoke-test the installers of this earlier run (run id); skips verify and package"
        required: false
        default: ""
      extra_env:
        description: "Extra environment for the app in smoke tests, e.g. WEBKIT_DISABLE_DMABUF_RENDERER=1"
        required: false
        default: ""
      linux_runner:
        description: "Linux smoke runner (the .deb is built on ubuntu-22.04 and installs on both)"
        required: false
        default: ubuntu-24.04
      linux_plain_webkit_check:
        description: "Linux smoke: also click fullscreen in a bare WebKitGTK window (no Tauri), to isolate engine crashes"
        type: boolean
        default: false
      linux_window_manager:
        description: "Linux smoke: window manager to run under Xvfb (openbox, or none)"
        required: false
        default: openbox

concurrency:
  # Pushes to a PR replace each other; manual smoke-only runs never cancel anything.
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify (${{ matrix.os }})
    if: ${{ !inputs.installers_from_run }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is pinned (same release as the smoke job): ubuntu-latest moves to Ubuntu 26
        # from 2026-10-19, and a runner-image change shouldn't turn a PR red on its own.
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential

      # env.sh puts the toolchain, registry, and target dir under .cache/ — the same layout as
      # a local build. The runner's preinstalled rustup installs the pinned toolchain there.
      - uses: actions/cache@v6
        with:
          path: |
            .cache/rustup
            .cache/cargo/registry
            .cache/cargo/git
            .cache/target
          key: verify-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: verify-${{ runner.os }}-

      - name: Install npm dependencies
        run: |
          source scripts/env.sh
          npm ci

      - name: Rust toolchain
        run: |
          source scripts/env.sh
          rustup toolchain install
          rustc --version

      - name: Verify (typecheck, lint, tests, UI build, rustfmt, clippy, cargo test)
        run: |
          source scripts/env.sh
          npm run verify

  # Builds what users download. Release builds happen only here, never on a developer machine.
  package:
    name: package (${{ matrix.name }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundles: nsis
            target: ""
          - name: macos
            os: macos-latest
            bundles: app,dmg
            target: universal-apple-darwin
          # The .deb on the oldest supported Ubuntu runner (its binary needs glibc 2.34), so it
          # installs on Ubuntu 22.04+ and Debian 12+, where it uses the system's WebKitGTK.
          - name: linux
            os: ubuntu-22.04
            bundles: deb
            target: ""
          # The AppImage carries the WebKitGTK of the machine that built it. 22.04's (2.50.4)
          # aborts on element fullscreen (the plan's Landmines), 24.04's (2.52) doesn't — so it is
          # built here, and its glibc floor rises to 2.39 (Ubuntu 24.04+, Debian 13, Fedora 40+).
          - name: linux-appimage
            os: ubuntu-24.04
            bundles: appimage
            target: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential file \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - uses: actions/cache@v6
        with:
          path: |
            .cache/rustup
            .cache/cargo/registry
            .cache/cargo/git
            .cache/target
          key: package-${{ matrix.name }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: package-${{ matrix.name }}-

      - name: Install npm dependencies
        run: |
          source scripts/env.sh
          npm ci

      - name: Rust toolchain
        run: |
          source scripts/env.sh
          rustup toolchain install
          if [ "${{ matrix.name }}" = macos ]; then
            rustup target add x86_64-apple-darwin aarch64-apple-darwin
          fi
          rustc --version

      - name: Build installers
        run: |
          source scripts/env.sh
          # The target dir is cached: drop installers from earlier runs so only fresh ones ship.
          rm -rf "$LJ_ROOT_POSIX"/.cache/target/release/bundle "$LJ_ROOT_POSIX"/.cache/target/*/release/bundle
          if [ -n "${{ matrix.target }}" ]; then
            npx tauri build --ci --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"
          else
            npx tauri build --ci --bundles "${{ matrix.bundles }}"
          fi

      - name: Collect installers
        run: |
          source scripts/env.sh
          mkdir -p bundles
          find "$LJ_ROOT_POSIX/.cache/target" -path '*/release/bundle/*' -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec cp {} bundles/ \;
          ls -l bundles
          test -n "$(ls bundles)"
          {
            echo "### Installers (${{ matrix.name }})"
            echo
            echo "| File | Size |"
            echo "|---|---|"
            for f in bundles/*; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect the .deb
        if: matrix.name == 'linux'
        run: |
          deb="$(ls bundles/*.deb | head -1)"
          dpkg-deb -I "$deb"
          # The newest glibc symbol version the binary needs: its floor (WebKitGTK is the system's).
          dir="$RUNNER_TEMP/deb" && rm -rf "$dir" && dpkg-deb -x "$deb" "$dir"
          glibc="$(grep -hoa 'GLIBC_2\.[0-9]*' "$dir/usr/bin/little-joan" | sort -uV | tail -1)"
          echo "glibc floor: $glibc"
          echo "The .deb needs ${glibc/_/ } or later (it uses the system's WebKitGTK)." >> "$GITHUB_STEP_SUMMARY"

      # What the AppImage really carries: its WebKitGTK (the bundled library asked for its own
      # version), its glibc floor (the newest glibc symbol version any of its files needs), and
      # how it starts (AppRun). A bundled WebKitGTK older than 2.52 fails the job: 2.50 aborts on
      # element fullscreen.
      - name: Inspect the AppImage
        if: matrix.name == 'linux-appimage'
        run: |
          image="$PWD/$(ls bundles/*.AppImage | head -1)"
          chmod +x "$image"
          dir="$RUNNER_TEMP/appimage" && rm -rf "$dir" && mkdir -p "$dir"
          (cd "$dir" && "$image" --appimage-extract >/dev/null)
          root="$dir/squashfs-root"
          file "$root/AppRun"
          if file "$root/AppRun" | grep -q text; then head -n 40 "$root/AppRun"; fi
          ls "$root/apprun-hooks" 2>/dev/null || true
          lib="$(find "$root" -name 'libwebkit2gtk-4.1.so.*' -type f | head -1)"
          test -n "$lib"
          echo "bundled: ${lib#"$root"/}"
          version="$(python3 -I -c 'import ctypes, sys
          lib = ctypes.CDLL(sys.argv[1])
          print(f"{lib.webkit_get_major_version()}.{lib.webkit_get_minor_version()}.{lib.webkit_get_micro_version()}")' "$lib")"
          source_package="$(dpkg-query -W -f='${Package} ${Version}' libwebkit2gtk-4.1-0)"
          glibc="$(grep -rhoa 'GLIBC_2\.[0-9]*' "$root" | sort -uV | tail -1)"
          echo "WebKitGTK $version (from $source_package); glibc floor $glibc"
          {
            echo
            echo "The AppImage bundles **WebKitGTK $version** (\`$(basename "$lib")\`, from $source_package)"
            echo "and needs ${glibc/_/ } or later."
          } >> "$GITHUB_STEP_SUMMARY"
          minor="$(echo "$version" | cut -d. -f2)"
          if [ "$(echo "$version" | cut -d. -f1)" -lt 2 ] || { [ "$(echo "$version" | cut -d. -f1)" -eq 2 ] && [ "$minor" -lt 52 ]; }; then
            echo "::error::The AppImage bundles WebKitGTK $version; older than 2.52 aborts on element fullscreen"
            exit 1
          fi

      - name: Inspect the macOS app
        if: runner.os == 'macOS'
        run: |
          source scripts/env.sh
          app="$(find "$LJ_ROOT_POSIX/.cache/target/universal-apple-darwin/release/bundle/macos" -maxdepth 1 -name '*.app' | head -1)"
          lipo -archs "$app/Contents/MacOS/little-joan"
          codesign -dv "$app" 2>&1 | head -5
          du -sh "$app"

      - uses: actions/upload-artifact@v7
        with:
          name: little-joan-${{ matrix.name }}
          path: bundles/
          retention-days: 14
          if-no-files-found: error

  # Installs each installer the way a user would and drives the installed app: launching the
  # build folder can pass while the real installer is broken.
  smoke:
    name: smoke (${{ matrix.name }})
    needs: package
    # Normally after package; with installers_from_run, on its own against that run's installers.
    if: ${{ always() && (needs.package.result == 'success' || inputs.installers_from_run) }}
    # Linux mirrors were seen taking 20 minutes to deliver WebKitGTK.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            artifact: windows
            os: windows-latest
          - name: macos
            artifact: macos
            os: macos-latest
          # Ubuntu 22.04's current WebKitGTK (2.50.4) aborts when any page enters element
          # fullscreen — reproduced with a bare WebKitGTK window, no Tauri involved (see the plan's
          # Landmines) — so the installed .deb is smoke-tested on 24.04 (WebKitGTK 2.52).
          - name: linux
            artifact: linux
            os: ${{ inputs.linux_runner || 'ubuntu-24.04' }}
            screen: 1280x800x24
          # The same at scale factor 2 (GTK's GDK_SCALE on a 2560×1600 Xvfb screen = 1280×800
          # logical): the page must see the same logical viewport as at scale 1. The Windows and
          # macOS runners have no way to change their display scale.
          - name: linux-scale-2
            artifact: linux
            os: ${{ inputs.linux_runner || 'ubuntu-24.04' }}
            screen: 2560x1600x24
            app_env: GDK_SCALE=2
          # The AppImage (built on 24.04, with its own WebKitGTK 2.52), through the same smoke as
          # `linux`. The runners have no FUSE, so it extracts itself and runs from there
          # (APPIMAGE_EXTRACT_AND_RUN); every launch, the smoke's second instances included, shares
          # that folder, and NO_CLEANUP stops a second instance from deleting it as it exits while
          # the first still runs from it. Its glibc floor is 2.39: never on linux_runner's 22.04.
          - name: linux-appimage
            artifact: linux-appimage
            os: ubuntu-24.04
            screen: 1280x800x24
            app_env: APPIMAGE_EXTRACT_AND_RUN=1 NO_CLEANUP=1
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: little-joan-${{ matrix.artifact }}
          path: installers
          run-id: ${{ inputs.installers_from_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Install (Windows, NSIS installer, silent)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem installers -Filter *-setup.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem $env:LOCALAPPDATA -Recurse -Depth 2 -Filter little-joan.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "little-joan.exe not found after installing" }
          Get-ChildItem (Split-Path $exe.FullName) | Format-Table Name, Length
          "APP=$($exe.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Install (macOS, drag from the DMG)
        if: runner.os == 'macOS'
        run: |
          dmg="$(ls installers/*.dmg | head -1)"
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/lj-dmg "$dmg"
          mkdir -p "$RUNNER_TEMP/Applications"
          cp -R "/tmp/lj-dmg/Little Joan.app" "$RUNNER_TEMP/Applications/"
          hdiutil detach /tmp/lj-dmg
          app="$RUNNER_TEMP/Applications/Little Joan.app"
          codesign --verify --verbose "$app"
          lipo -archs "$app/Contents/MacOS/little-joan"
          echo "APP=$app/Contents/MacOS/little-joan" >> "$GITHUB_ENV"

      - name: Install (Linux, .deb through apt)
        if: runner.os == 'Linux' && matrix.artifact == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ./installers/*.deb xvfb xdotool imagemagick openbox dbus-x11 gdb
          echo "APP=$(command -v little-joan)" >> "$GITHUB_ENV"

      # As a user gets it: the release's file name (no space), made executable. An AppImage leaves
      # some libraries to the system — every desktop has them (linuxdeploy's excludelist: EGL and
      # GL with Mesa's drivers, GBM, ALSA, X11, fonts …); this runner lacks EGL, so those are
      # installed (no WebKitGTK), and anything still missing is listed. gdb can't follow the
      # AppImage's runtime into the app (AppRun is a shell script whose subshells it would follow
      # instead), so smoke.mts attaches gdb to the app once it runs: ptrace beyond a process's own
      # children must be allowed on this runner.
      - name: Install (Linux, the AppImage)
        if: matrix.artifact == 'linux-appimage'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool imagemagick openbox dbus-x11 gdb \
            libegl1 libgl1 libgles2 libgbm1 libegl-mesa0 libgl1-mesa-dri libasound2t64
          image="$RUNNER_TEMP/appimage/LittleJoan-$(node -p 'require("./package.json").version')-linux-x86_64.AppImage"
          mkdir -p "$(dirname "$image")"
          cp installers/*.AppImage "$image"
          chmod +x "$image"
          ls -l "$image"
          check="$RUNNER_TEMP/appimage-check" && rm -rf "$check" && mkdir -p "$check"
          (cd "$check" && "$image" --appimage-extract >/dev/null)
          root="$check/squashfs-root"
          missing=""
          while IFS= read -r -d '' file; do
            if [ "$(head -c 4 "$file" | tr -d '\177\000')" = ELF ]; then
              gaps="$(LD_LIBRARY_PATH="$root/usr/lib:$root/usr/lib/x86_64-linux-gnu" ldd "$file" 2>/dev/null | grep 'not found' | tr -s ' \t\n' ' ' || true)"
              if [ -n "$gaps" ]; then missing+="${file#"$root"/}:$gaps"$'\n'; fi
            fi
          done < <(find "$root/usr" -type f -print0)
          if [ -n "$missing" ]; then
            printf 'Not in the AppImage nor on this runner:\n%s' "$missing"
            echo "::warning::The AppImage needs libraries this runner lacks (the step's log lists them)"
          else
            echo "Every library the AppImage's files need is in it or on this runner."
          fi
          rm -rf "$check"
          if [ -e /proc/sys/kernel/yama/ptrace_scope ]; then sudo sysctl -w kernel.yama.ptrace_scope=0; fi
          echo "APP=$image" >> "$GITHUB_ENV"

      # Diagnostics: the same click in a bare WebKitGTK 4.1 window built with PyGObject (no Tauri,
      # wry, or tao), to tell an engine crash from an embedding one. The system's WebKitGTK, so only
      # where the .deb runs; before the app's smoke, which may run into the job's time limit after an
      # abort. Three variants (LJ14): WebKitGTK's own handling ("default"), an `enter-fullscreen`
      # handler that returns TRUE ("handled": WebKit declines the page's request), and that plus the
      # window fullscreened by the handler ("handled-window", as Little Joan's stopgap does).
      - name: Bare WebKitGTK fullscreen check (Linux, diagnostics only)
        if: ${{ !cancelled() && matrix.artifact == 'linux' && inputs.linux_plain_webkit_check }}
        run: |
          sudo apt-get install -y python3-gi gir1.2-webkit2-4.1 xvfb xdotool openbox dbus-x11
          cat > /tmp/plain.html <<'HTML'
          <!doctype html><title>plain ready</title>
          <div id="s" style="position:fixed;inset:0;background:#f7c948" onclick="this.requestFullscreen().catch((e) => { document.title = 'plain request refused: ' + e.name; })"></div>
          <script>
          document.addEventListener("fullscreenchange", () => { document.title = "plain fullscreen=" + (document.fullscreenElement ? "on" : "off"); });
          document.addEventListener("fullscreenerror", () => { document.title = "plain fullscreenerror"; });
          </script>
          HTML
          cat > /tmp/plain.py <<'PY'
          import sys
          import gi
          gi.require_version("Gtk", "3.0")
          gi.require_version("Gdk", "3.0")
          gi.require_version("WebKit2", "4.1")
          from gi.repository import Gdk, GLib, Gtk, WebKit2
          mode = sys.argv[1] if len(sys.argv) > 1 else "default"
          print(f"plain ({mode}): WebKitGTK {WebKit2.get_major_version()}.{WebKit2.get_minor_version()}.{WebKit2.get_micro_version()}", flush=True)
          window = Gtk.Window()
          window.set_default_size(480, 640)
          window.set_position(Gtk.WindowPosition.CENTER)
          view = WebKit2.WebView()
          view.connect("notify::title", lambda v, _: print("title:", v.get_title(), flush=True))
          def on_enter(_view):
              print(f"enter-fullscreen: {mode}", flush=True)
              if mode == "handled-window":
                  window.fullscreen()
              return mode != "default"
          view.connect("enter-fullscreen", on_enter)
          window.connect("window-state-event", lambda _w, e: print("window fullscreen:", bool(e.new_window_state & Gdk.WindowState.FULLSCREEN), flush=True) or False)
          window.add(view)
          view.load_uri("file:///tmp/plain.html")
          window.show_all()
          GLib.timeout_add_seconds(30, Gtk.main_quit)
          Gtk.main()
          print(f"plain ({mode}): main loop ended normally", flush=True)
          PY
          for mode in default handled handled-window; do
            xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- bash -c '
              openbox & sleep 2
              python3 /tmp/plain.py "$0" & app=$!
              sleep 8
              xdotool mousemove 640 400 click 1
              sleep 8
              if kill -0 "$app" 2>/dev/null; then echo "BARE WEBKITGTK ($0): still running after the click"; kill "$app"; else wait "$app"; echo "BARE WEBKITGTK ($0): exited with status $?"; fi
              wait "$app" 2>/dev/null || true
            ' "$mode"
          done

      - name: Smoke test (Windows, macOS)
        if: runner.os != 'Linux'
        env:
          LJ_SMOKE_EXTRA_ENV: ${{ inputs.extra_env }}
        run: node scripts/ci/smoke.mts --app "$APP" --out test-results/smoke

      - name: Smoke test (Linux, X11 + session bus + window manager)
        if: runner.os == 'Linux'
        env:
          # Run the app under gdb so a crash leaves a backtrace in the log. (Symbols were tried:
          # debuginfod downloads time out, and Ubuntu's ddebs have no symbols for WebKitGTK 2.50.4.)
          LJ_SMOKE_GDB: "1"
          LJ_SMOKE_EXTRA_ENV: ${{ inputs.extra_env }} ${{ matrix.app_env }}
          LJ_WM: ${{ inputs.linux_window_manager || 'openbox' }}
          LJ_SCREEN: ${{ matrix.screen }}
        run: |
          xvfb-run -a -s "-screen 0 $LJ_SCREEN" dbus-run-session -- bash -c \
            'if [ "$LJ_WM" != none ]; then openbox & sleep 2; fi; node scripts/ci/smoke.mts --app "$APP" --out test-results/smoke'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-${{ matrix.name }}
          path: test-results/smoke/
          retention-days: 14
